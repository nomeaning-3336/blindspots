<!doctype html><html><head><meta charset="utf-8"><title>Logo</title><link rel="stylesheet" href="_card.css"><style>
.logo-card { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; padding: 0; }
.logo-cell { padding: 32px 28px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; border-radius: 12px; }
.paper { background: var(--bs-paper-bg); color: var(--bs-paper-fg-1); }
.dark  { background: var(--bs-dark-bg); color: var(--bs-dark-fg-1); }
.logo-svg { width: 72px; height: 72px; }
.wordmark { font-family: var(--bs-font-display); font-weight: 600; font-size: 22px; letter-spacing: -0.015em; }
.wordmark .tld { color: var(--bs-purple); }
.lockup { display: flex; align-items: center; gap: 10px; }
</style></head>
<body><div class="bs-card flush"><div class="logo-card">
  <div class="logo-cell paper">
    <svg class="logo-svg" viewBox="0 0 24 24" fill="none"><rect x="2" y="2" width="20" height="20" rx="3" stroke="#1a1714" stroke-width="1.6"/><circle cx="12" cy="12" r="3.2" fill="#1F6F87"/><path d="M12 4.5v3M12 16.5v3M4.5 12h3M16.5 12h3" stroke="#1a1714" stroke-width="1.6" stroke-linecap="round"/></svg>
    <div class="lockup"><span class="wordmark">blindspots<span class="tld">.gg</span></span></div>
  </div>
  <div class="logo-cell dark">
    <svg class="logo-svg" viewBox="0 0 24 24" fill="none"><rect x="2" y="2" width="20" height="20" rx="3" stroke="#ece9e0" stroke-width="1.6"/><circle cx="12" cy="12" r="3.2" fill="#1F6F87"/><path d="M12 4.5v3M12 16.5v3M4.5 12h3M16.5 12h3" stroke="#ece9e0" stroke-width="1.6" stroke-linecap="round"/></svg>
    <div class="lockup"><span class="wordmark">blindspots<span class="tld">.gg</span></span></div>
  </div>
</div></div></body></html>
