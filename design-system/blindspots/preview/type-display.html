<!doctype html><html><head><meta charset="utf-8"><title>Type — Display</title><link rel="stylesheet" href="_card.css"><style>
.spec { display: flex; flex-direction: column; gap: 22px; }
.h-hero { font-family: var(--bs-font-display); font-weight: 600; color: var(--bs-fg-1); letter-spacing: -0.015em; line-height: 1.1; font-size: 40px; }
.h-page { font-family: var(--bs-font-display); font-weight: 600; color: var(--bs-fg-1); letter-spacing: -0.015em; line-height: 1.15; font-size: 28px; }
.meta { font-family: var(--bs-font-mono); font-size: 11px; color: var(--bs-fg-3); margin-top: 6px; }
.tag { display: inline-block; padding: 2px 7px; background: var(--bs-paper-surface-1); color: var(--bs-fg-2); border-radius: 999px; font-size: 10px; font-weight: 600; letter-spacing: 0.04em; }
</style></head><body><div class="bs-card"><div class="spec">
  <div>
    <div class="h-hero">Spot your blindspots.</div>
    <div class="meta">Space Grotesk · 40 / 44 · –1.5% tracking · 600 — used on marketing pages only</div>
  </div>
  <div>
    <div class="h-page">Your turn. White to move.</div>
    <div class="meta">Space Grotesk · 28 / 32 · in-app page heading</div>
  </div>
  <div class="meta"><span class="tag">USAGE</span> &nbsp; The brand has no display sizes above 44px. There are no hero moments.</div>
</div></div></body></html>
