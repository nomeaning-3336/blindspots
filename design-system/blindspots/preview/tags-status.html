<!doctype html><html><head><meta charset="utf-8"><title>Tags & training states</title><link rel="stylesheet" href="_card.css"><style>
.wrap { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row-label { font-family: var(--bs-font-mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--bs-fg-3); width: 80px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; font-size: 12px; font-weight: 500; border-radius: 999px; }
.chip .dot { width: 6px; height: 6px; border-radius: 50%; }
.chip.new      { background: rgba(31, 111, 135,0.10); color: #1A607A; }
.chip.due      { background: rgba(217,126,45,0.12); color: #a85e1b; }
.chip.mastered { background: rgba(111,178,74,0.12); color: #507f33; }
.chip.suspended{ background: var(--bs-paper-surface-1); color: var(--bs-fg-3); }
.chip.opening  { background: rgba(31, 111, 135,0.08); color: #144A5C; }
.chip.eco      { background: var(--bs-paper-surface-1); color: var(--bs-fg-2); font-family: var(--bs-font-mono); }
.chip.endgame  { background: rgba(93,131,163,0.14); color: #34556e; }
.chip.middlegame{ background: rgba(138,155,111,0.16); color: #4f5d3a; }
.chip.new .dot { background: #1F6F87; }
.chip.due .dot { background: #d97e2d; }
.chip.mastered .dot { background: #6fb24a; }
</style></head><body><div class="bs-card"><div class="wrap">
  <div class="row"><span class="row-label">state</span>
    <span class="chip new"><span class="dot"></span>New</span>
    <span class="chip due"><span class="dot"></span>Due</span>
    <span class="chip mastered"><span class="dot"></span>Mastered</span>
    <span class="chip suspended">Suspended</span>
  </div>
  <div class="row"><span class="row-label">theme</span>
    <span class="chip opening">Caro-Kann</span>
    <span class="chip eco">B12</span>
    <span class="chip middlegame">Middlegame</span>
    <span class="chip endgame">R+P endgame</span>
    <span class="chip endgame">Opposite-color bishops</span>
  </div>
</div></div></body></html>
