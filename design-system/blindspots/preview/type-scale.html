<!doctype html><html><head><meta charset="utf-8"><title>Type scale</title><link rel="stylesheet" href="_card.css"><style>
.scale { display: flex; flex-direction: column; gap: 4px; }
.row { display: flex; align-items: baseline; gap: 18px; padding: 6px 0; border-bottom: 1px dashed var(--bs-paper-divider); }
.row:last-child { border-bottom: none; }
.row .text { font-family: var(--bs-font-display); color: var(--bs-fg-1); letter-spacing: -0.01em; line-height: 1.15; flex: 1; }
.row .key { font-family: var(--bs-font-mono); font-size: 10px; color: var(--bs-fg-3); width: 100px; flex-shrink: 0; text-align: right; }
</style></head><body><div class="bs-card"><div class="scale">
  <div class="row"><span class="text" style="font-size:34px;font-weight:600">Aa</span><span class="key">2xl · 34 · 600</span></div>
  <div class="row"><span class="text" style="font-size:26px;font-weight:600">Aa Your turn</span><span class="key">xl · 26 · 600</span></div>
  <div class="row"><span class="text" style="font-size:20px;font-weight:600">Aa Section heading</span><span class="key">lg · 20 · 600</span></div>
  <div class="row"><span class="text" style="font-size:17px;font-weight:600">Aa Subheading</span><span class="key">md · 17 · 600</span></div>
  <div class="row"><span class="text" style="font-size:15px;font-weight:400;color:var(--bs-fg-2)">Aa Body — the default reading size</span><span class="key">base · 15 · 400</span></div>
  <div class="row"><span class="text" style="font-size:13px;font-weight:400;color:var(--bs-fg-2)">Aa Small / metadata</span><span class="key">sm · 13 · 400</span></div>
  <div class="row"><span class="text" style="font-size:11px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:var(--bs-fg-3)">Aa Eyebrow label</span><span class="key">xs · 11 · 600</span></div>
</div></div></body></html>
