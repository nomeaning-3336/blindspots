<!doctype html><html><head><meta charset="utf-8"><title>Foreground</title><link rel="stylesheet" href="_card.css"><style>
.fg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.row { padding: 13px 16px; border-radius: 8px; background: var(--bs-paper-surface-1); display: flex; flex-direction: column; gap: 3px; }
.row .big { font-size: 16px; font-weight: 600; font-family: var(--bs-font-display); letter-spacing: -0.01em; }
.row .meta { font-family: var(--bs-font-mono); font-size: 10px; color: var(--bs-fg-3); }
</style></head><body><div class="bs-card"><div class="fg">
  <div class="row"><span class="big" style="color:#1a1714">Primary ink</span><span class="meta">--bs-fg-1 · #1A1714</span></div>
  <div class="row"><span class="big" style="color:#54504a">Secondary</span><span class="meta">--bs-fg-2 · #54504A</span></div>
  <div class="row"><span class="big" style="color:#87827a">Tertiary</span><span class="meta">--bs-fg-3 · #87827A</span></div>
  <div class="row"><span class="big" style="color:#b0aa9d">Hint / disabled</span><span class="meta">--bs-fg-4 · #B0AA9D</span></div>
</div></div></body></html>
