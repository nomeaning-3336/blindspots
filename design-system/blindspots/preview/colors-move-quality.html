<!doctype html><html><head><meta charset="utf-8"><title>Move quality colors</title><link rel="stylesheet" href="_card.css"><style>
.q { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.tag { padding: 12px; border-radius: 8px; display: flex; flex-direction: column; gap: 4px; }
.tag b { font-size: 12px; font-weight: 700; }
.tag code { font-family: var(--bs-font-mono); font-size: 10px; opacity: 0.85; }
</style></head><body><div class="bs-card"><div class="q">
  <div class="tag" style="background:#1bb6e0;color:#fff"><b>Brilliant</b><code>#1BB6E0</code></div>
  <div class="tag" style="background:#6fb24a;color:#fff"><b>Best / Excellent</b><code>#6FB24A</code></div>
  <div class="tag" style="background:#8a9b6f;color:#fff"><b>Okay</b><code>#8A9B6F</code></div>
  <div class="tag" style="background:#5d83a3;color:#fff"><b>Critical</b><code>#5D83A3</code></div>
  <div class="tag" style="background:#c9a73a;color:#fff"><b>Inaccuracy</b><code>#C9A73A</code></div>
  <div class="tag" style="background:#d97e2d;color:#fff"><b>Mistake</b><code>#D97E2D</code></div>
  <div class="tag" style="background:#c43b30;color:#fff"><b>Blunder</b><code>#C43B30</code></div>
  <div class="tag" style="background:var(--bs-paper-surface-1);color:var(--bs-fg-1);border:1px solid var(--bs-divider)"><b>Book / Theory</b><code>fg-2</code></div>
</div></div></body></html>
