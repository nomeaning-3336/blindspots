<!doctype html><html><head><meta charset="utf-8"><title>Spacing</title><link rel="stylesheet" href="_card.css"><style>
.scale { display: flex; flex-direction: column; gap: 5px; }
.row { display: flex; align-items: center; gap: 14px; }
.bar { background: var(--bs-purple); height: 16px; border-radius: 3px; }
.row .name { font-family: var(--bs-font-mono); font-size: 11px; color: var(--bs-fg-3); width: 64px; }
.row .px   { font-family: var(--bs-font-mono); font-size: 11px; color: var(--bs-fg-1); width: 32px; text-align: right; }
</style></head><body><div class="bs-card"><div class="scale">
  <div class="row"><span class="name">space-1</span><span class="bar" style="width:4px"></span><span class="px">4</span></div>
  <div class="row"><span class="name">space-2</span><span class="bar" style="width:8px"></span><span class="px">8</span></div>
  <div class="row"><span class="name">space-3</span><span class="bar" style="width:12px"></span><span class="px">12</span></div>
  <div class="row"><span class="name">space-4</span><span class="bar" style="width:16px"></span><span class="px">16</span></div>
  <div class="row"><span class="name">space-5</span><span class="bar" style="width:20px"></span><span class="px">20</span></div>
  <div class="row"><span class="name">space-6</span><span class="bar" style="width:24px"></span><span class="px">24</span></div>
  <div class="row"><span class="name">space-8</span><span class="bar" style="width:32px"></span><span class="px">32</span></div>
  <div class="row"><span class="name">space-10</span><span class="bar" style="width:40px"></span><span class="px">40</span></div>
  <div class="row"><span class="name">space-12</span><span class="bar" style="width:48px"></span><span class="px">48</span></div>
  <div class="row"><span class="name">space-16</span><span class="bar" style="width:64px"></span><span class="px">64</span></div>
</div></div></body></html>
